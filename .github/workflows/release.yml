name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish release
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Build and verify tagged release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/validate.py --tag "$RELEASE_TAG"
          make dist
          python3 scripts/validate.py --tag "$RELEASE_TAG" --notes dist/release-notes.md
          cd dist
          sha256sum --check ./*.sha256
      - name: Publish archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 \
            --verify-tag --draft --title "Super T ${RELEASE_TAG#v}" \
            --notes-file dist/release-notes.md "${prerelease[@]}"
          gh release edit "$RELEASE_TAG" --draft=false
